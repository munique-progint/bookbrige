    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
    <link href="css/bookbridge.css" rel="stylesheet">

</head>

<body>

    <!-- Navegação-->
    <nav class="navbar navbar-expand-lg navbar-light" style="background-color:#FBDD91;">
        <div class="container px-5">
            <a class="navbar-brand fs-2 fw-bold" href="index.html" style="color:#DF8F9C;">BookBridge</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="index.html">Início</a></li>
                    <li class="nav-item"><a class="nav-link" href="conteudos.html">Conteúdos</a></li>
                    <li class="nav-item"><a class="nav-link" href="materiais.html">Doações</a></li>
                    <li class="nav-item"><a class="nav-link" href="minha-conta.html">Minha Conta</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <section class="py-5 mb-5">
        <div class="container px-5" style="margin-bottom: 150px;">

            <div class="text-center mb-5">

                <h2 class="fw-bolder" style="color:#4E0119;">
                    Doar Material
                </h2>

                <p class="fs-4">
                    Compartilhe materiais que podem ajudar outros estudantes.
                </p>

            </div>

            <div class="row justify-content-center">

                <div class="col-lg-8">

                    <div class="card doar-material-card p-5 mx-auto" style="max-width: 700px; width: 100%;">
                        <form action="processa-doacao.php" method="POST" enctype="multipart/form-data">

                        <label class="mb-2 fw-bold fs-5">
                            Nome do material
                        </label>

                        <input type="text" name="nome_material" class="form-control fs-5 mb-4 w-100"
    placeholder="Ex: Livro de Matemática" required>


                        <label class="mb-2 fw-bold fs-5">
                            Categoria
                        </label>

                       <select name="categoria" class="form-control fs-5 mb-4" required>

    <option value="">Selecione a categoria</option>

    <option value="Livro">Livro</option>

    <option value="Apostilas">Apostilas</option>

    <option value="Materiais escolares">Materiais escolares</option>

</select>

             <label class="mb-2 fw-bold fs-5">
    Área
</label>           
<select name="area" class="form-control fs-5 mb-4" required>
    <option value="">Selecione</option>
    <option value="Matemática">Matemática</option>
    <option value="Português">Português</option>
    <option value="Literatura">Literatura</option>
    <option value="Redação">Redação</option>
    <option value="Inglês">Inglês</option>
    <option value="Espanhol">Espanhol</option>
    <option value="História">História</option>
    <option value="Geografia">Geografia</option>
    <option value="Filosofia">Filosofia</option>
    <option value="Sociologia">Sociologia</option>
    <option value="Biologia">Biologia</option>
    <option value="Física">Física</option>
    <option value="Química">Química</option>
    <option value="Artes">Artes</option>
    <option value="Educação Física">Educação Física</option>
    <option value="Todas as matérias">Todas as matérias</option>
    <option value="Outra">Outra</option>
</select>

<label class="mb-2 fw-bold fs-5">
    Estado
</label>

<select name="estado" class="form-control fs-5 mb-4" required>
    <option value="">Selecione o estado</option>
    <option value="AC">Acre</option>
    <option value="AL">Alagoas</option>
    <option value="AP">Amapá</option>
    <option value="AM">Amazonas</option>
    <option value="BA">Bahia</option>
    <option value="CE">Ceará</option>
    <option value="DF">Distrito Federal</option>
    <option value="ES">Espírito Santo</option>
    <option value="GO">Goiás</option>
    <option value="MA">Maranhão</option>
    <option value="MT">Mato Grosso</option>
    <option value="MS">Mato Grosso do Sul</option>
    <option value="MG">Minas Gerais</option>
    <option value="PA">Pará</option>
    <option value="PB">Paraíba</option>
    <option value="PR">Paraná</option>
    <option value="PE">Pernambuco</option>
    <option value="PI">Piauí</option>
    <option value="RJ">Rio de Janeiro</option>
    <option value="RN">Rio Grande do Norte</option>
    <option value="RS">Rio Grande do Sul</option>
    <option value="RO">Rondônia</option>
    <option value="RR">Roraima</option>
    <option value="SC">Santa Catarina</option>
    <option value="SP">São Paulo</option>
    <option value="SE">Sergipe</option>
    <option value="TO">Tocantins</option>
</select>
                                                <label class="mb-2 fw-bold fs-5">
                            Nível
                        </label>

                    <select name="nivel" class="form-control fs-5 mb-4" required>

    <option value="">Selecione o nível</option>

    <option value="Ensino Fundamental">Ensino Fundamental</option>

    <option value="Ensino Médio">Ensino Médio</option>

    <option value="Ensino Superior">Ensino Superior</option>

    <option value="Curso livre">Curso livre</option>

    <option value="Outros">Outros</option>

</select>
                        
                        <label class="mb-2 fw-bold fs-5">
                            Descrição
                        </label>

                        <textarea name="descricao" class="form-control fs-5 mb-4" rows="4"
    placeholder="Conte um pouco sobre o material"></textarea>

                        <label class="mb-2 fw-bold fs-5">
                            Imagem do material
                        </label>

                        <input type="file" name="imagem" class="form-control mb-4">

                        <button class="btn px-4 py-2 rounded-pill fw-bold"
                            style="background-color:#4E0119; color:white;">
                            Enviar doação
                        </button>
</form>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer class="py-4 mt-auto" style="background-color:#4E0119;">
        <div class="container px-5">
            <div class="row align-items-center justify-content-between flex-column flex-sm-row">
                <div class="col-auto">
                    <div class="small m-0 text-white">© 2026 BookBridge - Compartilhando conhecimento</div>
                </div>

            </div>
        </div>
    </footer>

    <script src="js/scripts.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
